<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сервер Кодеров — Утилиты</title>
  <link rel="icon" href="assets/logo.gif" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="backdrop"></div>

  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.gif" alt="" class="logo" />
      <div>
        <span class="brand-title">Сервер Кодеров</span>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <span class="pill">Приветствую тебя!</span>
        <h1>Удалите комментарии<br /><span class="gradient">в коде за одну секунду</span></h1>
      </div>
    </section>

    <section id="tool" class="tool">
      <div class="tool-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>Исходный код</h2>
            <div class="panel-actions">
              <select id="languageSelect" class="lang-select" aria-label="Язык программирования"></select>
              <label class="file-btn">
                <input type="file" id="fileInput" hidden />
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 9l5-5 5 5"/><path d="M12 4v12"/></svg>
                Загрузить
              </label>
            </div>
          </div>
          <textarea id="inputCode" spellcheck="false" placeholder="// Вставьте ваш код сюда…&#10;function greet(name) {&#10;  // приветствие&#10;  return `Hello ${name}`;&#10;}"></textarea>
          <div class="panel-foot">
            <span id="inputStats" class="muted">0 символов</span>
            <div class="panel-foot-actions">
              <button id="sampleBtn" class="btn small ghost">Пример</button>
              <button id="clearBtn" class="btn small ghost">Очистить</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Чистый код</h2>
            <div class="panel-actions">
              <button id="copyBtn" class="btn small ghost" disabled>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Копировать
              </button>
              <button id="downloadBtn" class="btn small ghost" disabled>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 11l5 5 5-5"/><path d="M12 4v12"/></svg>
                Скачать
              </button>
            </div>
          </div>
          <textarea id="outputCode" spellcheck="false" readonly placeholder="Здесь появится результат…"></textarea>
          <div class="panel-foot">
            <span id="outputStats" class="muted">—</span>
            <div class="stats-chips" id="statsChips"></div>
          </div>
        </div>
      </div>

      <div class="tool-actions">
        <button id="removeBtn" class="btn primary big" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9h1m4 0h3"/><path d="M8 13h5"/><path d="M8 4h10a3 3 0 0 1 3 3v8c0 1.6-1.4 3-3 3h-5l-5 3v-3H8a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3"/><path d="M3 3l18 18"/></svg>
          Удалить комментарии
        </button>
      </div>
    </section>
  </main>

  <footer>
    <div class="foot-inner">
      <div class="foot-brand">
        <img src="assets/logo.gif" alt="" class="logo small" />
        <span>Сервер Кодеров</span>
      </div>
      <p class="muted">© 2026 Сервер Кодеров. Инструмент для разработчиков.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
