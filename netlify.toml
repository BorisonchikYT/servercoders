[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/remove"
  to = "/.netlify/functions/remove"
  status = 200
  force = true

[[redirects]]
  from = "/api/languages"
  to = "/.netlify/functions/remove?action=languages"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"