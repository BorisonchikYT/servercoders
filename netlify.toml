[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/remove"
  to = "/.netlify/functions/remove"
  status = 200
  force = true

[[redirects]]
  from = "/api/batch"
  to = "/.netlify/functions/batch"
  status = 200
  force = true

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

[[redirects]]
  from = "/api/snippets"
  to = "/.netlify/functions/snippets"
  status = 200
  force = true

[[redirects]]
  from = "/api/paste"
  to = "/.netlify/functions/paste"
  status = 200
  force = true

[[redirects]]
  from = "/api/explain"
  to = "/.netlify/functions/explain"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/p/:id"
  to = "/.netlify/functions/paste?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"